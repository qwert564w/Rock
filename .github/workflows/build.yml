name: Build and Release Rock Client

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
      
    - name: Get version from gradle.properties
      id: version
      run: |
        VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: Rockstar Client v${{ steps.version.outputs.version }}
        body: |
          Автоматическая сборка Rockstar Client для Minecraft 1.21.11
          
          **Требования:**
          - Minecraft 1.21.11
          - Fabric Loader 0.19.3+
          - Fabric API
          - Java 21
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build/libs/rockstar-client-sunshine-project-${{ steps.version.outputs.version }}.jar
        asset_name: rockstar-client-${{ steps.version.outputs.version }}.jar
        asset_content_type: application/java-archive
